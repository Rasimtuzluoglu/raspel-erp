# RasPel ERP - Development Only
# Sadece veritabani ve broker servisleri. Backend ve frontend'i local'de calistirin.
#
# Kullanim: docker compose -f docker-compose.dev.yml up -d
#
# NOT: Bu dosyadaki host portlari, prod docker-compose.yml ile CAKISMAYACAK sekilde
# ayri secilmistir (ornegin postgres prod:5433 / dev:5434). Boylece ikisi ayni anda
# calistirilabilir. Portlar DEV_* degiskenleriyle .env uzerinden degistirilebilir;
# prod'un POSTGRES_PORT/REDIS_PORT gibi degiskenlerinden bagimsizdir.
#
# NOT (yerel HTTP tam yigin): Backend'i compose ile calistirip http://localhost
# kullanacaksaniz .env icine APP_COOKIE_SECURE=false ve APP_SECURITY_HTTPS_ONLY=false
# yazin; prod docker-compose.yml varsayilani guvenli (true) kalir.

services:
  postgres:
    image: postgres:16-alpine
    container_name: raspel-postgres
    environment:
      POSTGRES_DB: raspelerp
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d raspelerp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: raspel-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-raspelRedis2026}
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-raspelRedis2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: raspel-rabbitmq
    ports:
      - "127.0.0.1:${DEV_RABBITMQ_PORT:-5673}:5672"
      - "127.0.0.1:${DEV_RABBITMQ_MGMT_PORT:-15673}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-raspel}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-raspelDev2026}
      RABBITMQ_DEFAULT_VHOST: /
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  adminer:
    image: adminer:4.8.1
    container_name: raspel-adminer
    ports:
      - "127.0.0.1:${DEV_ADMINER_PORT:-8083}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  minio:
    # Digest pin (immutable). Karsilik gelen MinIO surumu: RELEASE.2025-09-07T16-13-09Z.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: raspel-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "127.0.0.1:${DEV_MINIO_PORT:-9002}:9000"
      - "127.0.0.1:${DEV_MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  minio_data:
