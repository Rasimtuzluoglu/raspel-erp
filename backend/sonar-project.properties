# Faz 5: SonarQube statik analiz yapılandırması (opsiyonel).
# Çalıştırma: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
# (SONAR_HOST_URL ve SONAR_TOKEN ortam değişkenleri gerekir; CI'da koşullu çalıştırın.)
sonar.projectKey=raspel-erp-backend
sonar.projectName=RasPel ERP Backend
sonar.projectVersion=1.36.2
sonar.sourceEncoding=UTF-8
sonar.language=java

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# JaCoCo kapsam raporu (mvn verify ile üretilir).
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Üretilen/kopya dosyaları hariç tut.
sonar.exclusions=**/target/**,**/generated/**
