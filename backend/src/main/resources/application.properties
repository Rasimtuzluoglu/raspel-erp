spring.application.name=raspel-erp-api
server.port=8081

# PostgreSQL (Default)
spring.datasource.url=jdbc:postgresql://localhost:5433/raspelerp
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# HikariCP Connection Pool (Hiz optimizasyonu)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=600000

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
# No default-schema set — Flyway uses public automatically

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Redis Cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000
spring.data.redis.password=${REDIS_PASSWORD:}

# Cache TTL (saniye)
spring.cache.redis.time-to-live=300

# Logging
logging.level.root=INFO
logging.level.com.raspel.erp=INFO

# JWT — Üretimde mutlaka JWT_SECRET ortam değişkenini güçlü bir değerle ayarlayın!
app.jwt.secret=${JWT_SECRET:o9lsSe5h7vrXLKAJBapIaNzLikseOBjiF3rQ8y8Dh+W47l2ex4sGQ5Fi0k7ug8qmg+j7CXl2/YCsXOxIhIVIMA==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=/

# SMTP E-posta
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.from=${SPRING_MAIL_FROM:noreply@raspel-erp.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.health.mail.enabled=false
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3

# CORS (comma-separated origins, use http://localhost:* for dev)
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*

# Backup
app.backup.dir=${APP_BACKUP_DIR:/app/backups}
app.backup.db-host=${APP_BACKUP_DB_HOST:localhost}
app.backup.db-port=${APP_BACKUP_DB_PORT:5433}
app.backup.db-name=${APP_BACKUP_DB_NAME:raspelerp}
app.backup.retention-days=${APP_BACKUP_RETENTION_DAYS:30}
app.backup.db-password=${APP_BACKUP_DB_PASSWORD:}
app.backup.auto.cron=${APP_BACKUP_AUTO_CRON:0 0 3 * * ?}

# Varsayılan KDV Oranı
app.kdv.varsayilan-oran=${APP_KDV_VARSAYILAN_ORAN:20}

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
