# =============================================================
# RasPel ERP - Production Profile
# =============================================================
# Activate with: SPRING_PROFILES_ACTIVE=prod
# Or: java -jar app.jar --spring.profiles.active=prod
# =============================================================

# Logging (less verbose in production)
logging.level.root=WARN
logging.level.com.raspel.erp=INFO

# JPA/Hibernate (production settings)
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP Connection Pool (higher for production)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=600000

# Flyway (strict validation in production)
spring.flyway.validate-on-migrate=true

# Cache TTL (longer caching in production)
spring.cache.redis.time-to-live=600

# Resilience4j Circuit Breaker (stricter in production)
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=40

# Backup (production defaults)
app.backup.retention-days=${APP_BACKUP_RETENTION_DAYS:90}
app.backup.auto.cron=${APP_BACKUP_AUTO_CRON:0 0 2 * * ?}
