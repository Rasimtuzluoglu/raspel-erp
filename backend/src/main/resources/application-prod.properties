# =============================================================
# RasPel ERP - Production Profile
# =============================================================
# Activate with: SPRING_PROFILES_ACTIVE=prod
# Or: java -jar app.jar --spring.profiles.active=prod
# =============================================================

# Logging (less verbose in production)
logging.level.root=WARN
logging.level.com.raspel.erp=INFO

# JPA/Hibernate (production settings)
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Tomcat thread havuzu (10 kullanici / ~5000 islem-gun hedefi): varsayilan 200 thread
# her biri ~0.5 MB native stack tuketir; sinirlandirilarak bellek baskisi dusurulur.
server.tomcat.threads.max=60
server.tomcat.threads.min-spare=5
server.tomcat.max-connections=1000
server.tomcat.accept-count=100

# HikariCP Connection Pool (postgres max_connections=100; backend 15 ile sinirli).
# 10 kullanici / 5000 islem-gun icin 15 baglanti fazlasiyla yeterlidir; havuzun
# her baglantisi hem backend hem postgres tarafinda bellek tuketir.
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.validation-timeout=3000

# Flyway (strict validation in production; baseline kapali — gecmis olmayan DB'ye
# sessizce baseline uygulanip migration'larin atlanmasi engellenir)
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

# Cache TTL (longer caching in production)
spring.cache.redis.time-to-live=600

# Security: cookie + CORS hardening
app.cookie.secure=true
app.security.https-only=true

# JWT: prod'da ortam degiskeni zorunlu, varsayilan secret yok
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Redis/RabbitMQ: prod'da ortam degiskenleri zorunludur (fail-fast)
spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.rabbitmq.host=${RABBITMQ_HOST:}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}

# Veritabani: prod'da ortam degiskenleri zorunludur (fail-fast)
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.url=${DB_URL:}

# E-posta: prod'da SMTP bilgileri zorunludur
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

# Yedekleme DB sifresi
app.backup.db-password=${APP_BACKUP_DB_PASSWORD:}

# CORS: prod'da domain acikca belirtilmeli
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://localhost}

# Gercek uretimde varsayilan true: localhost origin'lerini reddeder (fail-fast).
# Yalnizca yerel HTTP gelistirme icin APP_SECURITY_STRICT_DOMAINS=false yapin.
app.security.strict-domains=${APP_SECURITY_STRICT_DOMAINS:true}

# Object Storage: prod'da varsayilan MinIO (fail-fast)
app.storage.type=${APP_STORAGE_TYPE:minio}
app.storage.minio.endpoint=${MINIO_ENDPOINT:}
app.storage.minio.access-key=${MINIO_ROOT_USER:}
app.storage.minio.secret-key=${MINIO_ROOT_PASSWORD:}
app.storage.minio.bucket=${MINIO_BUCKET:raspel-erp}
