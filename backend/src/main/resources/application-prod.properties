# =============================================================
# RasPel ERP - Production Profile
# =============================================================
# Activate with: SPRING_PROFILES_ACTIVE=prod
# Or: java -jar app.jar --spring.profiles.active=prod
# =============================================================

# Logging (less verbose in production)
logging.level.root=WARN
logging.level.com.raspel.erp=INFO

# JPA/Hibernate (production settings)
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP Connection Pool (higher for production)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=600000

# Flyway (strict validation in production)
spring.flyway.validate-on-migrate=true

# Cache TTL (longer caching in production)
spring.cache.redis.time-to-live=600

# Security: cookie + CORS hardening
app.cookie.secure=true
app.security.https-only=true

# JWT: prod'da ortam degiskeni zorunlu, varsayilan secret yok
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Redis/RabbitMQ: prod'da ortam degiskenleri zorunludur (fail-fast)
spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.rabbitmq.host=${RABBITMQ_HOST:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}

# CORS: prod'da domain acikca belirtilmeli
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://localhost}
