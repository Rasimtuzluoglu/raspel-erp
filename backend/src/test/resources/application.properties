# Test overrides for properties required by beans loaded in @WebMvcTest context
app.jwt.secret=dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciB0aGUgand0IHRva2VuIGdlbmVyYXRpb24gYWxnb3JpdGhtIGluIHRoZSBhcHBsaWNhdGlvbiBmb3IgdGVzdGluZyBwdXJwb3Nlcw==
app.jwt.expiration-ms=86400000
spring.data.redis.host=localhost
spring.data.redis.port=6379
# H2 schema.sql çalıştırma (schema.sql Hibernate DDL'den ÖNCE çalışır ki şemalar DDL sırasında var olsun)
spring.sql.init.mode=always

# Flyway'i test ortamında kapat (PostgreSQL migration'ları H2 ile uyumsuz)
spring.flyway.enabled=false

# Hibernate DDL (H2 için otomatik tablo oluşturma/silme)
spring.jpa.hibernate.ddl-auto=create-drop

# RabbitMQ yokken testler hızlı fail olsun (context load uzamasın)
app.rabbitmq.enabled=false
spring.rabbitmq.connection-timeout=1000
spring.rabbitmq.listener.simple.auto-startup=false
