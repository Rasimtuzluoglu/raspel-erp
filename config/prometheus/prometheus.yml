global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['raspel-alertmanager:9093']

scrape_configs:
  - job_name: 'traefik'
    static_configs:
      - targets: ['raspel-traefik:8083']

  - job_name: 'backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['raspel-backend:8081']
