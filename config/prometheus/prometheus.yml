global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['raspel-alertmanager:9093']

scrape_configs:
  - job_name: 'traefik'
    static_configs:
      - targets: ['raspel-traefik:8083']

  - job_name: 'backend'
    metrics_path: '/actuator/prometheus'
    # /actuator/prometheus artik anonim degil; scrape paylasilan token ile yapilir.
    # Token docker-compose'da APP_METRICS_SCRAPE_TOKEN olarak backend ile ayni degere ayarlanir.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['raspel-backend:8081']
