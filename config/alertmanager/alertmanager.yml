global:
  resolve_timeout: 5m

route:
  receiver: 'default'
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 4h

receivers:
  - name: 'default'
    # Slack entegrasyonu: SLACK_WEBHOOK_URL ortam degiskeni tanimliysa alertler Slack'e gider.
    # Tanimli degilse entrypoint bu blogu kaldirir, alertler yalnizca web arayuzunde gorunur.
    slack_configs:
      - api_url: '__SLACK_WEBHOOK_URL__'
        channel: '#raspel-alerts'
        send_resolved: true
