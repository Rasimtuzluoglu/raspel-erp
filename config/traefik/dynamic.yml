http:
  middlewares:
    redirect-https:
      redirectScheme:
        scheme: https
        permanent: true

    ratelimit:
      rateLimit:
        average: 100
        burst: 50

    # Guvenlik basliklari: API ve frontend router'larina uygulanir.
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true
        customFrameOptionsValue: "DENY"
        customResponseHeaders:
          Permissions-Policy: "camera=(self), microphone=(self), geolocation=(self)"
          Server: ""
          X-Powered-By: ""

    cors-headers:
      headers:
        accessControlAllowOriginList:
          - "http://localhost:5173"
          - "http://localhost:8000"
          - "http://localhost"
          - "https://localhost"
        accessControlAllowMethods: "GET,POST,PUT,DELETE,OPTIONS"
        accessControlAllowHeaders: "*"
        accessControlAllowCredentials: true
        accessControlMaxAge: 3600

    # Traefik dashboard icin temel kimlik dogrulama.
    #
    # DASHBOARD_BASIC_AUTH doluysa (htpasswd formati: `kullanici:$2y$...`) bu
    # middleware tanimlanir; `docker-compose.yml` dashboard router'ina
    # `DASHBOARD_MIDDLEWARES` ile ekler.
    #
    # KOSULLU OLMANIN SEBEBI: `basicAuth.users: ['']` gecersiz bir kayittir ve
    # dosya saglayicisinin bu middleware'i dusurmesine yol acar (dashboard 500).
    # .env'de de bos birakildigi icin dashboard hicbir zaman acilmazdi.
    #
    # Bos birakilmasinin guvenlik acigi olmamasi icin dashboard yine de SADECE
    # loopback'e bagli portta calisir (127.0.0.1:8080). URETIMDE
    # `DASHBOARD_BASIC_AUTH` + `DASHBOARD_MIDDLEWARES` ZORUNLUDUR
    # (docs/GO-LIVE.md checklist).
    {{ if ne (env "DASHBOARD_BASIC_AUTH") "" }}
    dashboard-auth:
      basicAuth:
        users:
          - '{{ env "DASHBOARD_BASIC_AUTH" }}'
    {{ end }}

  routers:
    # HTTP (port 80) — gercek domainler HTTPS'e yonlendirilir. localhost/127.0.0.1
    # yerel gelistirme icin HTTP olarak birakilir (ACME localhost'a sertifika uretemez).
    # ACME http-01 challenge router'i Traefik tarafindan otomatik eklenir.
    web-redirect:
      rule: 'PathPrefix(`/`) && !Host(`localhost`) && !Host(`127.0.0.1`)'
      service: noop@internal
      entryPoints:
        - web
      middlewares:
        - redirect-https
      priority: 100000

    # Yerel HTTP erisim (dev): redirect yok, dogrudan servis edilir.
    frontend-http-local:
      rule: 'PathPrefix(`/`) && !PathPrefix(`/api`) && (Host(`localhost`) || Host(`127.0.0.1`))'
      service: frontend
      entryPoints:
        - web
      middlewares:
        - security-headers
      priority: 5

    api-http-local:
      rule: 'PathPrefix(`/api`) && (Host(`localhost`) || Host(`127.0.0.1`))'
      service: backend
      entryPoints:
        - web
      middlewares:
        - cors-headers
        - ratelimit
        - security-headers
      priority: 6

    # Yerel HTTPS (dev). Iki ayri konu:
    #
    # 1) BU ROUTER'LAR VAR, cunku `security-headers` icindeki HSTS (stsSeconds +
    #    includeSubdomains + preload) tarayiciyi localhost'u HTTPS'e zorlar.
    #    Bu yuzden localhost'ta HTTPS erisimi BIRAKILAMAZ.
    #
    # 2) `tls: {}` BOS OLMALI. Traefik `websecure` uzerindeki bir router'da `tls`
    #    bolumu YOKSA o router'i hic yonlendirmeye katmaz ve 404 doner (router
    #    "enabled" gorunse bile eslesmez). Bos blok, sertifika istemeden Traefik'in
    #    kendi self-signed varsayilan sertifikasini kullanmasini saglar.
    #
    # ONCEKI DAVRANIS: Bu yol `frontend@file` router'i ile `certResolver:
    # letsencrypt` tasiyordu. Let's Encrypt `localhost`a sertifika VERMEDIGI icin
    # Traefik her acilista reddedilen ACME istegi atiyor, loga
    # `rejectedIdentifier` hatasi yaziyor ve sonunda ayni self-signed sertifikayi
    # sunuyordu. Simdi: ayni sertifika, ayni 200, ACME hatasi YOK.
    frontend-https-local:
      rule: 'PathPrefix(`/`) && !PathPrefix(`/api`) && (Host(`localhost`) || Host(`127.0.0.1`))'
      service: frontend
      entryPoints:
        - websecure
      middlewares:
        - security-headers
      # `tls: {}` BOS OLMALI: bu blok sertifika ISTEMIYOR, Traefik'in kendi
      # self-signed varsayilan sertifikasini kullanir. Dolu bir `certResolver`
      # yazilirsa (ornegin letsencrypt) ACME localhost'a sertifika veremedigi icin
      # router'i devre disi birakip 404 donduruyor.
      tls: {}
      priority: 3

    api-https-local:
      rule: 'PathPrefix(`/api`) && (Host(`localhost`) || Host(`127.0.0.1`))'
      service: backend
      entryPoints:
        - websecure
      middlewares:
        - cors-headers
        - ratelimit
        - security-headers
      # Bkz. `frontend-https-local`: `tls: {}` olmadan websecure router'i calismiyor.
      tls: {}
      priority: 4

    # Uretim HTTPS (port 443) — yalnizca APP_DOMAIN GERCEK BIR ALAN ADI oldugunda.
    #
    # NEDEN KOSULLU: Bu blok kosulsuz oldugunda, yerel gelistirmede
    # (APP_DOMAIN=localhost) `certResolver: letsencrypt` localhost'a sertifika
    # isteyecek, Let's Encrypt reddedecek ve log `rejectedIdentifier` ile dolacak.
    # Dolayisiyla:
    #   - APP_DOMAIN=localhost          -> yalnizca yukaridaki *-https-local
    #                                      router'lari vardir (sertifikasiz, gurultusuz)
    #   - APP_DOMAIN=erp.sirketiniz.com -> bu blok tanimli, letsencrypt ile
    #                                      gercek sertifika alinir (degismeyen davranis)
    {{ if ne (env "APP_DOMAIN") "localhost" }}
    frontend:
      rule: 'PathPrefix(`/`) && !PathPrefix(`/api`) && Host(`{{ env "APP_DOMAIN" }}`)'
      service: frontend
      entryPoints:
        - websecure
      middlewares:
        - cors-headers
        - security-headers
      tls:
        certResolver: letsencrypt
      priority: 1

    api:
      rule: 'PathPrefix(`/api`) && Host(`{{ env "APP_DOMAIN" }}`)'
      service: backend
      entryPoints:
        - websecure
      middlewares:
        - cors-headers
        - ratelimit
        - security-headers
      tls:
        certResolver: letsencrypt
      priority: 2
    {{ end }}

  services:
    frontend:
      loadBalancer:
        servers:
          - url: "http://raspel-frontend:80"
        healthCheck:
          path: /
          interval: 10s
          timeout: 3s

    backend:
      loadBalancer:
        servers:
          - url: "http://raspel-backend:8081"
        healthCheck:
          path: /actuator/health
          interval: 10s
          timeout: 3s
