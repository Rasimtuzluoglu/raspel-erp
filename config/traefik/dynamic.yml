http:
  middlewares:
    redirect-https:
      redirectScheme:
        scheme: https
        permanent: true

    ratelimit:
      rateLimit:
        average: 100
        burst: 50

    cors-headers:
      headers:
        accessControlAllowOriginList:
          - "http://localhost:5173"
          - "http://localhost:8000"
          - "http://localhost"
          - "https://localhost"
        accessControlAllowMethods: "GET,POST,PUT,DELETE,OPTIONS"
        accessControlAllowHeaders: "*"
        accessControlAllowCredentials: true
        accessControlMaxAge: 3600

    # DASHBOARD_BASIC_AUTH ortam degiskeninden okunur (users: "kullanici:hash").
    # Uretmek icin: docker run --rm httpd:alpine htpasswd -nb admin GUCLU_SIFRENIZ
    # ve degeri .env dosyasina DASHBOARD_BASIC_AUTH=... olarak yazin.
    # .env dosyasinda bu degisken yoksa dashboard erisimi kapali kalir (fail-closed).
    dashboard-auth:
      basicAuth:
        users:
          - '{{ env "DASHBOARD_BASIC_AUTH" }}'

  routers:
    # HTTP (port 80) — sadece APP_DOMAIN'e izin verir, diger host'lar HTTPS'e yonlendirilir.
    # APP_DOMAIN degeri compose uzerinden traefik konteynerine env olarak verilir;
    # {{ env "APP_DOMAIN" }} file provider Go templating ile cozulur.
    web-redirect:
      rule: "PathPrefix(`/`) && !Host(`{{ env \"APP_DOMAIN\" }}`)"
      entryPoints:
        - web
      middlewares:
        - redirect-https
      priority: 100

    dashboard-http:
      rule: "PathPrefix(`/dashboard`) && Host(`{{ env \"APP_DOMAIN\" }}`)"
      service: api@internal
      entryPoints:
        - web
      middlewares:
        - dashboard-auth
      priority: 10

    frontend-http:
      rule: "PathPrefix(`/`) && !PathPrefix(`/api`) && !PathPrefix(`/adminer`) && !PathPrefix(`/dashboard`) && Host(`{{ env \"APP_DOMAIN\" }}`)"
      service: frontend
      entryPoints:
        - web
      middlewares:
        - cors-headers
      priority: 1

    api-http:
      rule: "PathPrefix(`/api`) && Host(`{{ env \"APP_DOMAIN\" }}`)"
      service: backend
      entryPoints:
        - web
      middlewares:
        - cors-headers
        - ratelimit
      priority: 2

    adminer-http:
      rule: "PathPrefix(`/adminer`) && Host(`{{ env \"APP_DOMAIN\" }}`)"
      service: adminer
      entryPoints:
        - web
      middlewares:
        - cors-headers
      priority: 3

    # HTTPS (port 443) — yalnizca APP_DOMAIN icin gecerli
    dashboard:
      rule: "PathPrefix(`/dashboard`) && Host(`{{ env \"APP_DOMAIN\" }}`)"
      service: api@internal
      entryPoints:
        - websecure
      middlewares:
        - dashboard-auth
      tls:
        certResolver: letsencrypt
      priority: 10

    frontend:
      rule: "PathPrefix(`/`) && !PathPrefix(`/api`) && !PathPrefix(`/adminer`) && !PathPrefix(`/dashboard`) && Host(`{{ env \"APP_DOMAIN\" }}`)"
      service: frontend
      entryPoints:
        - websecure
      middlewares:
        - cors-headers
      tls:
        certResolver: letsencrypt
      priority: 1

    api:
      rule: "PathPrefix(`/api`) && Host(`{{ env \"APP_DOMAIN\" }}`)"
      service: backend
      entryPoints:
        - websecure
      middlewares:
        - cors-headers
        - ratelimit
      tls:
        certResolver: letsencrypt
      priority: 2

    # Adminer: Yalnizca dev/debug profilinde calisir, production'da devre disidir
    adminer:
      rule: "PathPrefix(`/adminer`) && Host(`{{ env \"APP_DOMAIN\" }}`)"
      service: adminer
      entryPoints:
        - websecure
      middlewares:
        - cors-headers
        - dashboard-auth
      tls:
        certResolver: letsencrypt
      priority: 3

  services:
    frontend:
      loadBalancer:
        servers:
          - url: "http://raspel-frontend:80"
        healthCheck:
          path: /
          interval: 10s
          timeout: 3s

    backend:
      loadBalancer:
        servers:
          - url: "http://raspel-backend:8081"
        healthCheck:
          path: /actuator/health
          interval: 10s
          timeout: 3s

    adminer:
      loadBalancer:
        servers:
          - url: "http://raspel-adminer:8080"
        healthCheck:
          interval: 10s
          timeout: 3s
