http:
  middlewares:
    redirect-https:
      redirectScheme:
        scheme: https
        permanent: true

    ratelimit:
      rateLimit:
        average: 100
        burst: 50

    # Guvenlik basliklari: API ve frontend router'larina uygulanir.
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        frameDeny: true
        customFrameOptionsValue: "DENY"
        customResponseHeaders:
          Permissions-Policy: "camera=(self), microphone=(self), geolocation=(self)"
          Server: ""
          X-Powered-By: ""

    cors-headers:
      headers:
        accessControlAllowOriginList:
          - "http://localhost:5173"
          - "http://localhost:8000"
          - "http://localhost"
          - "https://localhost"
        accessControlAllowMethods: "GET,POST,PUT,DELETE,OPTIONS"
        accessControlAllowHeaders: "*"
        accessControlAllowCredentials: true
        accessControlMaxAge: 3600

    # Traefik dashboard icin Basic Auth. DASHBOARD_BASIC_AUTH tanimliysa (htpasswd
    # formati) dashboard erisimi korunur; tanimli degilse users bos kalir ve dashboard
    # router'i fail-closed olarak 401 doner. Sifre asla varsayilan/committed degildir.
    dashboard-auth:
      basicAuth:
        users:
          - "{{ env \"DASHBOARD_BASIC_AUTH\" }}"

  routers:
    # HTTP (port 80) — gercek domainler HTTPS'e yonlendirilir. localhost/127.0.0.1
    # yerel gelistirme icin HTTP olarak birakilir (ACME localhost'a sertifika uretemez).
    # ACME http-01 challenge router'i Traefik tarafindan otomatik eklenir.
    web-redirect:
      rule: 'PathPrefix(`/`) && !Host(`localhost`) && !Host(`127.0.0.1`)'
      service: noop@internal
      entryPoints:
        - web
      middlewares:
        - redirect-https
      priority: 100000

    # Yerel HTTP erisim (dev): redirect yok, dogrudan servis edilir.
    frontend-http-local:
      rule: 'PathPrefix(`/`) && !PathPrefix(`/api`) && (Host(`localhost`) || Host(`127.0.0.1`))'
      service: frontend
      entryPoints:
        - web
      middlewares:
        - security-headers
      priority: 5

    api-http-local:
      rule: 'PathPrefix(`/api`) && (Host(`localhost`) || Host(`127.0.0.1`))'
      service: backend
      entryPoints:
        - web
      middlewares:
        - cors-headers
        - ratelimit
        - security-headers
      priority: 6

    # HTTPS (port 443) — yalnizca APP_DOMAIN icin gecerli
    frontend:
      rule: 'PathPrefix(`/`) && !PathPrefix(`/api`) && Host(`{{ env "APP_DOMAIN" }}`)'
      service: frontend
      entryPoints:
        - websecure
      middlewares:
        - cors-headers
        - security-headers
      tls:
        certResolver: letsencrypt
      priority: 1

    api:
      rule: 'PathPrefix(`/api`) && Host(`{{ env "APP_DOMAIN" }}`)'
      service: backend
      entryPoints:
        - websecure
      middlewares:
        - cors-headers
        - ratelimit
        - security-headers
      tls:
        certResolver: letsencrypt
      priority: 2

  services:
    frontend:
      loadBalancer:
        servers:
          - url: "http://raspel-frontend:80"
        healthCheck:
          path: /
          interval: 10s
          timeout: 3s

    backend:
      loadBalancer:
        servers:
          - url: "http://raspel-backend:8081"
        healthCheck:
          path: /actuator/health
          interval: 10s
          timeout: 3s
