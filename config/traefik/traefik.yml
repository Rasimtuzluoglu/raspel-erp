global:
  sendAnonymousUsage: false

api:
  dashboard: true
  # `insecure: true` olmadan dashboard/API HICBIR entrypoint'te SERVIS EDILMEZ.
  # Yalnizca `dashboard: true` yazmak dashboardu acar ama erisilebilir kilmaz:
  # /dashboard/ ve /api/overview dahil TUM istekler 404 doner.
  #
  # Guvenlik: bu ayar API'yi `traefik` entrypoint'ine (varsayilan :8080) acar ve
  # bu port docker-compose.yml'de SADECE loopback'e baglidir
  # (`127.0.0.1:8080:8080`), yani dis ayudan erisilemez. Uretimde de ayni kalir.
  # Erisim korumasi `dynamic.yml`'deki basicAuth ile saglanir ve
  # `DASHBOARD_MIDDLEWARES` uzerinden kosullu uygulanir.
  insecure: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  traefik:
    address: ":8080"
  metrics:
    address: ":8083"

certificatesResolvers:
  letsencrypt:
    acme:
      # email DEGERI BURADA TANIMLANMAZ: Traefik statik config dosyasi ${VAR}
      # interpolasyonu desteklemez. Email docker-compose.yml'deki traefik
      # command (--certificatesresolvers.letsencrypt.acme.email) ile verilir.
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

# TLS: yalnizca guclu protokoller (TLS 1.2+) ve guvenli cipher suite'ler.
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

metrics:
  prometheus:
    entryPoint: metrics

accessLog: {}
