global:
  sendAnonymousUsage: false

api:
  dashboard: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  traefik:
    address: ":8080"
  metrics:
    address: ":8083"

certificatesResolvers:
  letsencrypt:
    acme:
      # email DEGERI BURADA TANIMLANMAZ: Traefik statik config dosyasi ${VAR}
      # interpolasyonu desteklemez. Email docker-compose.yml'deki traefik
      # command (--certificatesresolvers.letsencrypt.acme.email) ile verilir.
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

# TLS: yalnizca guclu protokoller (TLS 1.2+) ve guvenli cipher suite'ler.
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

metrics:
  prometheus:
    entryPoint: metrics

accessLog: {}
