x-guvenlik: &guvenlik
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  traefik:
    image: traefik:v3.0
    container_name: raspel-traefik
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Traefik :80/:443 icin root olarak dusuk port baglar; NET_BIND_SERVICE gerekir.
    cap_add:
      - NET_BIND_SERVICE
    # ACME email STATIK config dosyasinda ${VAR} ile genisletilemez (Traefik static
    # config env interpolasyonu desteklemez). Bu yuzden compose interpolation ile
    # CLI flag uzerinden verilir (config/traefik/traefik.yml'de email tanimli degil).
    command:
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@raspel.com}"
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      - DASHBOARD_BASIC_AUTH=${DASHBOARD_BASIC_AUTH:-}
    volumes:
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt_data:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=PathPrefix(`/dashboard`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=traefik"
      # DASHBOARD_MIDDLEWARES doluysa (ornegin `.env`'de
      # `DASHBOARD_MIDDLEWARES=dashboard-auth@file`) temel kimlik dogrulama
      # uygulanir. BOSSA hic middleware uygulanmaz.
      #
      # Neden bos birakilabiliyor: dashboard `traefik` entrypoint'inde ve bu port
      # SADECE 127.0.0.1'e baglidir (asagida `127.0.0.1:8080:8080`), yani dis
      # agdan erisilemez. `dashboard-auth` middleware'i `dynamic.yml`'de yalnizca
      # DASHBOARD_BASIC_AUTH doluyken tanimlanir; auth tanimli degilken bu
      # middleware'e atif yapmak dosya saglayicisini hata durumuna dusuruyordu.
      # URETIMDE `.env`'de `DASHBOARD_MIDDLEWARES=dashboard-auth@file` VE
      # `DASHBOARD_BASIC_AUTH=<htpasswd>` ZORUNLUDUR (docs/GO-LIVE.md).
      - "traefik.http.routers.dashboard.middlewares=${DASHBOARD_MIDDLEWARES:-}"
    restart: unless-stopped
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - backend
      - frontend
    # 8GB VPS: izleme/proxy konteynerleri de sinirlanir (limitsiz kalirsa backend'i ac birakabilir).
    mem_limit: ${TRAEFIK_MEM_LIMIT:-256m}
    memswap_limit: ${TRAEFIK_MEM_LIMIT:-256m}
    cpus: ${TRAEFIK_CPU_LIMIT:-0.5}
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: raspel-postgres
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    # PITR (point-in-time recovery): WAL arsivleme aciktir. Base backup + WAL ile
    # istenen ana geri donulebilir. archive_command basarisizsa WAL silinmez (test !).
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_timeout=60"
      - "-c"
      - "archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f"
      # 8GB VPS hedefi: DB bellegi paylasimli arabelleklere ayrilir (varsayilan 128MB yerine).
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "max_connections=100"
    environment:
      POSTGRES_DB: raspelerp
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups/wal-archive:/wal-archive
    restart: unless-stopped
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d raspelerp"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 1500m, cpus: "${POSTGRES_CPU_LIMIT:-2.0}" }
        reservations: { memory: 256m }
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: raspel-redis
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    # Tehlikeli komutlar kapatilir; parola argv'ye yazilmaz (REDIS_PASSWORD env'den).
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 200mb
      --maxmemory-policy noeviction
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command KEYS ""
      --rename-command CONFIG ""
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      # Parola ortam degiskeninden okunur; argv'de gorunmez.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 256m, cpus: "${REDIS_CPU_LIMIT:-0.5}" }
        reservations: { memory: 64m }
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: raspel-rabbitmq
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-raspel}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
      # Prometheus eklentisi: config/prometheus/prometheus.yml 'rabbitmq' isini
      # 15692 portundan scrape eder. Eklenti acilmazsa hedef kapali kalir ve
      # ServiceDown alarmi surekli yanar. Port disariya publish edilmez;
      # yalnizca backend-net icinden erisilir.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_prometheus 15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512m, cpus: "${RABBITMQ_CPU_LIMIT:-1.0}" }
        reservations: { memory: 128m }
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    # Digest pin (immutable). Karsilik gelen MinIO surumu: RELEASE.2025-09-07T16-13-09Z.
    # Tag yerine digest kullanilir; boylece registry'ye erisim olmasa bile yerel imajla calisir.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: raspel-minio
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512m, cpus: "${MINIO_CPU_LIMIT:-0.5}" }
        reservations: { memory: 128m }
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    container_name: raspel-backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Europe/Istanbul
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/raspelerp
      # Least-privilege: uygulama superuser yerine DML-yetkili app rolu ile baglanir.
      # Migration (Flyway) app rolu ile calisir; V123 app rolunu superuser tarafindan
      # onceden olusturulmus kabul eder (docker-entrypoint-initdb ile veya manuel).
      DB_USERNAME: ${APP_DB_USER:-raspelerp_app}
      DB_PASSWORD: ${APP_DB_PASSWORD:-}
      # Flyway migration'lari superuser ile calisir (V123 app rolunu olusturur),
      # uygulama ise app rolu ile baglanir.
      FLYWAY_URL: jdbc:postgresql://postgres:5432/raspelerp
      FLYWAY_USER: ${POSTGRES_USER:-postgres}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-raspel}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      APP_STORAGE_TYPE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-raspel-erp}
      JWT_SECRET: ${JWT_SECRET}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@raspel-erp.com}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://localhost}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-https://localhost}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_FROM: ${SPRING_MAIL_FROM:-noreply@raspel-erp.com}
      APP_BACKUP_DB_HOST: postgres
      APP_BACKUP_DB_PORT: 5432
      APP_BACKUP_DB_NAME: raspelerp
      APP_BACKUP_DIR: /app/backups
      APP_BACKUP_RETENTION_DAYS: 30
      # pg_dump, uygulamanin kullandigi DB rolüyle baglanir (DB_USERNAME).
      # Buraya POSTGRES_PASSWORD (superuser) verilirse kimlik dogrulama
      # basarisiz olur ve HER yedek bos (0 bayt) dosya olarak birikir.
      APP_BACKUP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
      # Yedekleme saatleri birbirinden AYRILDIR: dort yedek de ayni dakikada
      # (03:00) tetiklenince disk/CPO doyuyor ve isler birbirini bekliyordu.
      APP_BACKUP_AUTO_CRON: ${APP_BACKUP_AUTO_CRON:-0 0 3 * * ?}
      APP_BACKUP_WEEKLY_CRON: ${APP_BACKUP_WEEKLY_CRON:-0 20 3 ? * SUN}
      APP_BACKUP_MONTHLY_CRON: ${APP_BACKUP_MONTHLY_CRON:-0 30 3 1 * ?}
      APP_BACKUP_YEARLY_CRON: ${APP_BACKUP_YEARLY_CRON:-0 40 3 1 1 ?}
      APP_BACKUP_CLOUD_AUTO_CRON: ${APP_BACKUP_CLOUD_AUTO_CRON:-0 50 3 * * ?}
      APP_BACKUP_CLOUD_ENABLED: ${APP_BACKUP_CLOUD_ENABLED:-true}
      # Prod varsayilani guvenli (secure cookie + HTTPS zorunlu). Yerel HTTP gelistirme
      # icin .env uzerinden APP_COOKIE_SECURE=false / APP_SECURITY_HTTPS_ONLY=false yapin.
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-true}
      APP_SECURITY_HTTPS_ONLY: ${APP_SECURITY_HTTPS_ONLY:-true}
      # Uretim varsayilani true (localhost origin'lerini reddeder). Yerel gelistirme icin
      # .env uzerinden APP_SECURITY_STRICT_DOMAINS=false yapin.
      APP_SECURITY_STRICT_DOMAINS: ${APP_SECURITY_STRICT_DOMAINS:-true}
      # /actuator/prometheus scrape paylasilan token'i (Prometheus ile ayni deger).
      APP_METRICS_SCRAPE_TOKEN: ${APP_METRICS_SCRAPE_TOKEN:-}
    # Liveness = JVM ayakta mi. Readiness = trafik alabilir mi (DB/Redis hazir mi).
    # Once tek /actuator/health kullaniliyordu; DB yavasladiginda container
    # yeniden baslatiliyordu (restart loop) ve yavaslik kendiligine cozulmuyordu.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 20s
      timeout: 10s
      # DB yavasliginda 6 deneme * 20s = 2 dk tolerans; sonra unhealthy.
      retries: 6
      start_period: 90s
    volumes:
      - backup_data:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    networks:
      - backend-net
      - db-net
    deploy:
      resources:
        limits: { memory: 2g, cpus: "${BACKEND_CPU_LIMIT:-3.0}" }
        reservations: { memory: 256m }
    # Hard memory cap: JVM heap/metaspace/direct are bounded in the Dockerfile;
    # cgroup limit is the last line of defence. Stress test (200 VU) needed more
    # than 1 GiB, so the limit is configurable (default 2g).
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    memswap_limit: ${BACKEND_MEM_LIMIT:-2g}
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    container_name: raspel-frontend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    depends_on:
      backend:
        # Backend artik gercek bir healthcheck'e sahip: trafik ancak hazir oldugunda
        # frontend'e gonderilir (eskiden service_started ile aninda gonderiliyordu).
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend-net
      - backend-net
    deploy:
      resources:
        limits: { memory: 256m, cpus: "${FRONTEND_CPU_LIMIT:-0.5}" }
        reservations: { memory: 64m }
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  adminer:
    image: adminer:4.8.1
    container_name: raspel-adminer
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Production'da varsayilan olarak baslamaz; gerektiginde: docker compose --profile debug up -d adminer
    profiles: ["debug"]
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - db-net
      - backend-net
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB: raspelerp
    deploy:
      resources:
        limits: { memory: 256m, cpus: "${ADMINER_CPU_LIMIT:-0.2}" }
        reservations: { memory: 64m }
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Host seviyesi metrikler (CPU/RAM/disk/ag) icin node_exporter.
  # Docker Desktop (Windows) uyumu icin rslave/pid host yerine ayri yol eslemeleri kullanilir.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: raspel-node-exporter
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped
    networks:
      - backend-net
    deploy:
      resources:
        limits: { memory: 64m, cpus: "${NODE_EXPORTER_CPU_LIMIT:-0.2}" }
        reservations: { memory: 32m }
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL metrikleri (baglanti sayisi, kilitler, replika gecikmesi, tablo
  # buyume). HikariCP havuz doygunligu alarmi yalnizca uygulama tarafindan
  # gorulur; DB tarafi bu exporter ile izlenir.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: raspel-postgres-exporter
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Sifre environment'tan okunur; compose dosyasina duz yazilmaz.
      # DIKKAT: DATA_SOURCE_NAME bir DSN'dir (postgresql://... veya key=value),
      # DATA_SOURCE_URI/USER/PASS ile AYNI anda kullanilamaz. Tek hedef icin
      # URI + USER + PASS yeterlidir; ek hedef gerekiyorsa DATA_SOURCE_NAME
      # tam DSN olarak verilmelidir.
      DATA_SOURCE_URI: "postgres:5432/?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER:-postgres}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
      PG_EXPORTER_DISABLE_SSL: "true"
      PG_EXPORTER_EXTENSIONS: ""
    ports:
      - "127.0.0.1:9187:9187"
    restart: unless-stopped
    networks:
      # Iki agda da olmak zorunda: postgres yalnizca db-net'te (DNS adi orada
      # cozulur), Prometheus ise yalnizca backend-net uzerinden scrape eder.
      # Tek agda kalmasi "lookup postgres: no such host" ile baglanamamaya yol acar.
      - db-net
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits: { memory: 128m, cpus: "${POSTGRES_EXPORTER_CPU_LIMIT:-0.3}" }
        reservations: { memory: 32m }
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: raspel-prometheus
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 256GB SSD hedefi: metrik gecmisi 15 gun ile sinirlanir (varsayilan sinirsiz buyume yerine).
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=2GB'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_scrape_token
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /run/secrets/metrics_scrape_token /etc/prometheus/metrics_token
        chmod 0400 /etc/prometheus/metrics_token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d --storage.tsdb.retention.size=2GB
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    memswap_limit: ${PROMETHEUS_MEM_LIMIT:-512m}
    deploy:
      resources:
        limits: { memory: 512m, cpus: "${PROMETHEUS_CPU_LIMIT:-0.5}" }
        reservations: { memory: 128m }
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.0.0
    container_name: raspel-grafana
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - backend-net
    mem_limit: ${GRAFANA_MEM_LIMIT:-384m}
    memswap_limit: ${GRAFANA_MEM_LIMIT:-384m}
    deploy:
      resources:
        limits: { memory: 384m, cpus: "${GRAFANA_CPU_LIMIT:-0.3}" }
        reservations: { memory: 128m }
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: raspel-alertmanager
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      SMTP_SMARTHOST: ${SMTP_SMARTHOST:-}
      SMTP_FROM: ${SMTP_FROM:-alertmanager@raspel-erp.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ./config/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
    restart: unless-stopped
    networks:
      - backend-net
    mem_limit: ${ALERTMANAGER_MEM_LIMIT:-128m}
    memswap_limit: ${ALERTMANAGER_MEM_LIMIT:-128m}
    deploy:
      resources:
        limits: { memory: 128m, cpus: "${ALERTMANAGER_CPU_LIMIT:-0.2}" }
        reservations: { memory: 64m }
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # Yuk/stres testi araci (k6). Normal calismada baslamaz; profil ile acilir:
  #   docker compose --profile loadtest run --rm k6 run load.js
  k6:
    image: grafana/k6:0.54.0
    container_name: raspel-k6
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    profiles: ["loadtest"]
    environment:
      BASE_URL: http://raspel-backend:8081
      TEST_USER: ${LOADTEST_USER:-admin_test}
      TEST_PASSWORD: ${LOADTEST_PASSWORD:-Test1234!}
      TEST_SIRKET_ID: ${LOADTEST_SIRKET_ID:-5}
      DURATION: ${LOADTEST_DURATION:-1m}
    volumes:
      - ./loadtest:/scripts:ro
    working_dir: /scripts
    command: ["run", "smoke.js"]
    networks:
      - backend-net

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  db-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  backup_data:
  rabbitmq_data:
  letsencrypt_data:
  minio_data:
  redis_data:

secrets:
  metrics_scrape_token:
    environment: APP_METRICS_SCRAPE_TOKEN
