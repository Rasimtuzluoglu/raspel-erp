name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and Test Backend
        run: mvn -B clean verify -e
        working-directory: ./backend
      - name: Upload Backend Coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Lint
        run: npx eslint src --ext .js,.vue
        working-directory: ./frontend
      - name: i18n integrity check
        run: npm run i18n:check
        working-directory: ./frontend
      - name: Test with Coverage
        run: npm run test -- --coverage
        working-directory: ./frontend
      - name: Build
        run: npm run build
        working-directory: ./frontend
      - name: Upload Frontend Coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: ./frontend

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Docs sync check (structure counts)
        run: node scripts/docs-sync.mjs --check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Start dev server (PWA service worker yok, E2E stabil)
        working-directory: ./frontend
        run: |
          nohup npx vite --host 127.0.0.1 --port 5173 --strictPort > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:5173; then
              echo "Dev server hazir (${i}s)."
              exit 0
            fi
            sleep 1
          done
          echo "HATA: Dev server 60 sn icinde ayaga kalkmadi. Log:"
          cat /tmp/vite.log
          exit 1
      - name: Cypress E2E tests
        run: npx cypress run
        working-directory: ./frontend
      - name: Upload Cypress screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots/
          if-no-files-found: ignore
      - name: Upload dev server log (on failure)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: vite-log
          path: /tmp/vite.log
          if-no-files-found: ignore

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Gitleaks'in push aralığını (before..after) doğru hesaplayabilmesi için
          # tam geçmiş gerekir; aksi halde shallow checkout nedeniyle tüm geçmiş taranır.
          fetch-depth: 0
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          hide-progress: true
          trivyignores: '.trivyignore'
          skip-dirs: 'node_modules,target,dist,.git,frontend/coverage,frontend/cypress/screenshots'
          github-pat: ${{ secrets.GITHUB_TOKEN }}
      - name: Gitleaks - Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Guvenlik ve e2e gecmeden deploy edilmez.
    needs: [backend, frontend, e2e, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY secrets not configured in repo settings - skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy via SSH
        if: steps.check.outputs.skip == 'false'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            docker compose up -d --build --wait
            curl -fsS http://localhost/ >/dev/null
            echo "Deploy tamamlandi."
