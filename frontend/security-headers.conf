# Guvenlik basliklari. nginx'te bir location kendi add_header'ini tanimlarsa
# ust seviyeden miras alinan add_header'lar DUSER. Bu nedenle bu snippet her
# location icinde ayrica include edilir.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
# script-src 'unsafe-eval': vue-i18n'in calisma zamani mesaj derleyicisi (new Function)
# icin gereklidir. connect-src: service worker Google Fonts'u onbellege alabilir.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;" always;

